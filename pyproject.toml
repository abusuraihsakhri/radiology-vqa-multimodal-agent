[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radiology-vqa-multimodal-engine"
version = "2.0.0"
description = "RadVQA-Sentinel: Radiology Visual Question Answering & Verification"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
radiology-vqa-multimodal-engine = "rad_vqa_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/radiology-vqa-multimodal-engine"
Repository = "https://github.com/abusuraihsakhri/radiology-vqa-multimodal-engine.git"
