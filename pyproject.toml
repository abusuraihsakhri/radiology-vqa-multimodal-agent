[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radiology-vqa-multimodal-engine"
version = "2.0.1"
description = "Rule-based radiology-themed QA and audit workflow prototype (no image interpretation)"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.100,<1", "uvicorn>=0.23,<1"]
test = ["pytest>=7,<10", "httpx>=0.24,<1"]

[project.scripts]
radiology-vqa-multimodal-agent = "cli:main"
radiology-vqa-multimodal-engine = "rad_vqa_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/radiology-vqa-multimodal-agent"
Repository = "https://github.com/abusuraihsakhri/radiology-vqa-multimodal-agent"

[tool.setuptools]
packages = ["agents", "rad_vqa_agent"]
py-modules = ["cli", "enrichment", "simulator", "rad_vqa_agent_app"]
