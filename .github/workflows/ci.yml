name: Tests and security checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[api,test]"
      - name: Compile Python
        run: python -m compileall -q agents rad_vqa_agent cli.py enrichment.py simulator.py
      - name: Unit and regression tests
        run: python -m pytest -q
      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.items = []
              def handle_starttag(self, tag, attrs):
                  self.inside = tag == "script" and not dict(attrs).get("src")
              def handle_data(self, data):
                  if self.inside:
                      self.items.append(data)
              def handle_endtag(self, tag):
                  if tag == "script":
                      self.inside = False

          for page in ("docs/index.html", "web/index.html"):
              parser = Scripts()
              parser.feed(Path(page).read_text(encoding="utf-8"))
              for script in parser.items:
                  subprocess.run(["node", "--check", "-"], input=script, text=True, check=True)
          PY
